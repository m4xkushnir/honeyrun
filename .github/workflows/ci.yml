name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"   # test fixtures write Unicode; the code itself sets UTF-8 explicitly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: Static check needs no sandbox on any OS
        run: |
          set +e
          honeyrun bench/fixtures/mal-static-agent-hooks --static-only --no-history --agent
          test $? -eq 1
        shell: bash

  bench-gvisor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: bash scripts/install-gvisor.sh
      - run: pip install -e .
      - name: Run every fixture under gVisor
        run: python bench/run.py --runtime runsc
      - if: always()
        run: cat bench/out/RESULTS.md >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-results
          path: bench/out/

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Benign fixture passes
        uses: ./
        with:
          target: bench/fixtures/ok-npm-build
      - name: Malicious fixture fails
        id: bad
        continue-on-error: true
        uses: ./
        with:
          target: bench/fixtures/mal-npm-ssh-exfil
      - run: test "${{ steps.bad.outcome }}" = failure

  real-repos-gvisor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: bash scripts/install-gvisor.sh
      - run: pip install -e .
      - name: Well-known repos with network on (false-positive check)
        run: python bench/run.py --real --runtime runsc
      - if: always()
        run: cat bench/out/REAL.md >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: real-repos
          path: bench/out/

  podman-rootless:
    # No Docker daemon: the same fixtures through rootless Podman.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: podman --version && podman info --format '{{.Host.Security.Rootless}}'
      - name: Fixtures under rootless Podman
        run: python bench/run.py --engine podman --only ssh-exfil,https-env,timebomb,wiper,ok-npm-build,ok-py-package,static
      - if: always()
        run: cat bench/out/RESULTS.md >> "$GITHUB_STEP_SUMMARY"
